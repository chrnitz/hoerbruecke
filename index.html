<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>HörBrücke</title>
<style>
:root {
  --bg:#000000; --card:#000000; --border:rgba(0,255,80,.2);
  --green:#00ff50; --yellow:#ffe000;
  --red:#ff4444; --text:#00ff50; --dim:#00cc40;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000000;color:var(--text);font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background:#000000}

/* ── HEADER ── */
.hdr{display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;border-bottom:1px solid var(--border);flex-shrink:0;
  background:#000000}
.logo{font-size:1.15rem;font-weight:800;letter-spacing:-.03em;color:var(--green)}
.logo b{color:var(--green)}
.pill{display:flex;align-items:center;gap:6px;padding:4px 10px;
  border-radius:99px;border:1px solid var(--border);
  font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);
  background:#000000}
.dot{width:6px;height:6px;border-radius:50%;background:var(--dim);flex-shrink:0}
.pill.on .dot{background:var(--green);box-shadow:0 0 7px var(--green);animation:bl 1.2s infinite}
.pill.on{border-color:rgba(0,255,80,.4);color:var(--green)}
.pill.tr .dot{background:var(--yellow);animation:bl .5s infinite}
.pill.tr{border-color:rgba(255,224,0,.3);color:var(--yellow)}
.pill.er .dot{background:var(--red)}
.pill.er{border-color:rgba(255,68,68,.4);color:var(--red)}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.2}}

/* ── INTERNET WARNUNG ── */
#net-warn{display:none;flex-shrink:0;padding:8px 14px;
  background:#000000;border-bottom:1px solid rgba(255,68,68,.4);
  font-size:.72rem;color:#ff8080;text-align:center;line-height:1.5}
#net-warn.show{display:block}

/* ── SPRACHE + ÜBERSETZEN ── */
.langbar{display:flex;align-items:center;gap:6px;padding:8px 14px;
  border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;
  background:#000000}
.lbtn{flex:1;min-width:52px;padding:7px 4px;border-radius:8px;
  border:1px solid var(--border);background:#000000;
  color:var(--dim);font-size:.7rem;cursor:pointer;text-align:center;
  touch-action:manipulation;transition:all .2s}
.lbtn.on{border-color:var(--green);color:var(--green);background:#000000;
  text-shadow:0 0 8px rgba(0,255,80,.6)}
.lbtn:active{transform:scale(.94)}
.tbtn{padding:7px 11px;border-radius:8px;
  border:1px solid var(--border);background:#000000;
  color:var(--dim);font-size:.7rem;cursor:pointer;white-space:nowrap;
  touch-action:manipulation;transition:all .2s}
.tbtn.on{border-color:var(--yellow);color:var(--yellow);background:#000000}
.tbtn:active{transform:scale(.94)}

/* ── VERLAUF ── */
.hist{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:10px 14px;display:flex;flex-direction:column;gap:6px;min-height:0;
  background:#000000}
.hist::-webkit-scrollbar{display:none}
.hline{font-size:clamp(.85rem,3.2vw,1rem);color:rgba(0,255,80,.55);
  line-height:1.55;animation:fu .3s ease}
.hline .orig{display:block;font-size:.78em;color:rgba(0,255,80,.3);margin-top:2px}
@keyframes fu{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.sep{border:none;border-top:1px solid var(--border);flex-shrink:0}

/* ── AKTUELL ── */
.cur-wrap{flex-shrink:0;padding:10px 14px 6px;background:#000000;margin-bottom:18px}
.cur-lbl{font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(0,255,80,.45);margin-bottom:5px}
#cur{font-size:clamp(1.5rem,6vw,2.4rem);font-weight:700;line-height:1.2;
  letter-spacing:-.02em;word-break:break-word;min-height:2.5rem;
  color:var(--green);text-shadow:0 0 20px rgba(0,255,80,.5)}
#cur .interim{color:rgba(0,255,80,.65)}
#cur .hint{color:rgba(0,255,80,.25)}
.blink{display:inline-block;width:3px;height:.8em;
  background:var(--green);margin-left:3px;vertical-align:middle;
  animation:bc .8s step-end infinite;box-shadow:0 0 6px var(--green)}
@keyframes bc{0%,100%{opacity:1}50%{opacity:0}}

/* ── CONTROLS ── */
.ctrl{display:flex;align-items:center;justify-content:space-around;
  padding:12px 14px 14px;border-top:1px solid var(--border);flex-shrink:0;
  background:#000000}
.micbtn{width:74px;height:74px;border-radius:50%;
  border:2px solid var(--border);background:#000000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  cursor:pointer;touch-action:manipulation;transition:all .25s;
  color:var(--green);font-size:.58rem;letter-spacing:.08em;text-transform:uppercase}
.micbtn svg{width:26px;height:26px}
.micbtn.on{background:#000000;border-color:var(--green);color:var(--green);
  box-shadow:0 0 20px rgba(0,255,80,.4);
  animation:pu 2s ease-out infinite}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(0,255,80,.5)}70%{box-shadow:0 0 0 20px rgba(0,255,80,0)}100%{box-shadow:0 0 0 0 rgba(0,255,80,0)}}
.clrbtn{width:50px;height:50px;border-radius:50%;
  border:1px solid var(--border);background:#000000;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;touch-action:manipulation;color:var(--dim)}
.clrbtn svg{width:20px;height:20px}
.clrbtn:active{border-color:var(--red);color:var(--red)}
.bars{display:flex;align-items:center;gap:3px;height:36px;width:36px;justify-content:center}
.bar{width:4px;border-radius:2px;background:rgba(0,255,80,.15);transition:background .3s}
.bars.on .bar{background:var(--green);box-shadow:0 0 4px var(--green)}

/* ── FULLSCREEN BUTTON ── */
#fsbtn{
  width:34px;height:34px;border-radius:8px;
  border:1px solid var(--border);background:#000000;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;touch-action:manipulation;color:var(--green);
  flex-shrink:0;transition:all .2s;padding:0;
}
#fsbtn svg{width:16px;height:16px}
#fsbtn:active{background:rgba(0,255,80,.1);border-color:var(--green)}

/* ── VOLLBILD-MODUS: nur Untertitel sichtbar wie Even G1 ── */
.fullscreen-mode .hdr,
.fullscreen-mode .langbar,
.fullscreen-mode #net-warn,
.fullscreen-mode .hist,
.fullscreen-mode .sep,
.fullscreen-mode .cur-lbl,
.fullscreen-mode .ctrl {
  display: none !important;
}
.fullscreen-mode {
  background: #000000 !important;
  justify-content: flex-end;
}
.fullscreen-mode .cur-wrap {
  padding: 0 20px 40px;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}
.fullscreen-mode #cur {
  font-size: clamp(1.8rem, 7vw, 3.2rem);
  text-shadow: 0 0 30px rgba(0,255,80,.6);
  line-height: 1.25;
}

/* Exit-Button im Vollbild unten rechts */
.fullscreen-mode .fs-exit-hint {
  display: flex !important;
}
.fs-exit-hint {
  display: none;
  position: fixed;
  bottom: 16px;
  right: 16px;
  z-index: 999;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
}
.fs-mic-btn {
  width: 56px; height: 56px; border-radius: 50%;
  border: 2px solid var(--border); background: #000000;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; touch-action: manipulation; color: var(--green);
  transition: all .25s;
}
.fs-mic-btn.on {
  border-color: var(--green);
  box-shadow: 0 0 16px rgba(0,255,80,.3);
  animation: pu 2s ease-out infinite;
}
.fs-mic-btn svg { width: 22px; height: 22px; }
.fs-exit-btn {
  width: 40px; height: 40px; border-radius: 8px;
  border: 1px solid var(--border); background: #000000;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; touch-action: manipulation; color: var(--dim);
}
.fs-exit-btn svg { width: 16px; height: 16px; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="logo">Hör<b>Brücke</b></div>
  <div style="display:flex;align-items:center;gap:8px">
    <div class="pill" id="pill"><div class="dot"></div><span id="pill-txt">Bereit</span></div>
    <button id="fsbtn" onclick="toggleFullscreen()" title="Vollbild">
      <svg id="fs-icon-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/>
        <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
      </svg>
      <svg id="fs-icon-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
        <polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/>
        <line x1="10" y1="14" x2="3" y2="21"/><line x1="21" y1="3" x2="14" y2="10"/>
      </svg>
    </button>
  </div>
</div>

<!-- INTERNET WARNUNG -->
<div id="net-warn">
  ⚠ Keine Internetverbindung – Übersetzung nicht verfügbar.<br>
  Bitte WLAN oder Mobilnetz einschalten.
</div>

<!-- SPRACHE + ÜBERSETZEN -->
<div class="langbar">
  <button class="lbtn on" id="lb-de" onclick="setLang('de')">🇩🇪 DE</button>
  <button class="lbtn"    id="lb-en" onclick="setLang('en')">🇺🇸 EN</button>
  <button class="lbtn"    id="lb-es" onclick="setLang('es')">🇪🇸 ES</button>
  <button class="tbtn" id="tbtn" onclick="toggleTranslate()">→🇩🇪 Übersetzen</button>
</div>

<!-- VERLAUF -->
<div class="hist" id="hist"></div>
<hr class="sep">

<!-- AKTUELL -->
<div class="cur-wrap">
  <div class="cur-lbl">↓ Aktuell</div>
  <div id="cur"><span class="hint">EIN drücken → sprechen</span></div>
</div>

<!-- CONTROLS -->
<div class="ctrl">
  <button class="clrbtn" onclick="clearAll()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/>
      <path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/>
    </svg>
  </button>

  <button class="micbtn" id="micbtn" onclick="toggleMic()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      <line x1="12" y1="19" x2="12" y2="23"/>
      <line x1="8" y1="23" x2="16" y2="23"/>
    </svg>
    <span id="mic-lbl">EIN</span>
  </button>

  <div class="bars" id="bars">
    <div class="bar" id="b0" style="height:6px"></div>
    <div class="bar" id="b1" style="height:12px"></div>
    <div class="bar" id="b2" style="height:20px"></div>
    <div class="bar" id="b3" style="height:12px"></div>
    <div class="bar" id="b4" style="height:6px"></div>
  </div>
</div>

<!-- VOLLBILD EXIT + MIC OVERLAY -->
<div class="fs-exit-hint" id="fs-hint">
  <button class="fs-mic-btn" id="fs-mic" onclick="toggleMic()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      <line x1="12" y1="19" x2="12" y2="23"/>
      <line x1="8" y1="23" x2="16" y2="23"/>
    </svg>
  </button>
  <button class="fs-exit-btn" onclick="toggleFullscreen()" title="Vollbild beenden">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/>
      <line x1="10" y1="14" x2="3" y2="21"/><line x1="21" y1="3" x2="14" y2="10"/>
    </svg>
  </button>
</div>

<script>
// ═══════════════════════════════════════════════════
//  HörBrücke
//  iOS/Desktop : Web Speech API, continuous=true
//  Android     : Web Speech API, continuous=false
//                + Neustart nach jedem Satz
//  Übersetzung : MyMemory + Google Translate (kostenlos)
// ═══════════════════════════════════════════════════

const LANGS = {
  de: { code:'de-DE', flag:'🇩🇪', name:'Deutsch' },
  en: { code:'en-US', flag:'🇺🇸', name:'English' },
  es: { code:'es-ES', flag:'🇪🇸', name:'Español' },
};

const isAndroid = /android/i.test(navigator.userAgent);
const isIOS     = /iPad|iPhone|iPod/.test(navigator.userAgent)
                  || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const isSamsung = /SamsungBrowser/i.test(navigator.userAgent);

let lang       = 'de';
let xlate      = false;
let listening  = false;   // EINZIGE Quelle der Wahrheit: true=läuft, false=gestoppt
let hideTimer  = null;
let sessionSet = new Set();
let restartTimer = null;

let rec = null;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

const pill    = document.getElementById('pill');
const pillTxt = document.getElementById('pill-txt');
const cur     = document.getElementById('cur');
const hist    = document.getElementById('hist');
const micbtn  = document.getElementById('micbtn');
const micLbl  = document.getElementById('mic-lbl');
const barsEl  = document.getElementById('bars');
const netWarn = document.getElementById('net-warn');
const tbtn    = document.getElementById('tbtn');
const bars    = [0,1,2,3,4].map(i=>document.getElementById('b'+i));
let barAnim   = null;
const BAR_H   = [6,12,20,12,6];

// Samsung-Browser hat kein Web Speech – Hinweis zeigen
if (isSamsung || !SR) {
  document.getElementById('net-warn').innerHTML = '⚠ Spracherkennung nicht verfügbar. '
    + 'Bitte <strong>Chrome</strong> verwenden: '
    + '<a href="https://play.google.com/store/apps/details?id=com.android.chrome" '
    + 'style="color:#ffe000">Chrome herunterladen →</a>';
  document.getElementById('net-warn').classList.add('show');
}

// ── Sprachauswahl ──
function setLang(l) {
  lang = l;
  ['de','en','es'].forEach(x=>
    document.getElementById('lb-'+x).classList.toggle('on',x===l));
  if (listening) { stopMic(); setTimeout(startMic,400); }
}

// ── Übersetzen ──
async function toggleTranslate() {
  if (!xlate) {
    tbtn.textContent='⟳ Prüfe …'; tbtn.disabled=true;
    let ok=false;
    try {
      ok = await Promise.race([
        fetch('https://api.mymemory.translated.net/get?q=hello&langpair=en|de',
          {mode:'cors',cache:'no-store'}).then(r=>r.json()).then(d=>d.responseStatus===200),
        new Promise((_,r)=>setTimeout(()=>r(false),5000))
      ]);
    } catch(e){}
    tbtn.disabled=false;
    if (ok) {
      xlate=true; tbtn.textContent='✓ Übersetzen AN'; tbtn.classList.add('on');
      netWarn.classList.remove('show');
    } else {
      xlate=false; tbtn.textContent='→🇩🇪 Übersetzen'; tbtn.classList.remove('on');
      netWarn.innerHTML='⚠ Übersetzung nicht verfügbar – kein Internet? '
        +'<button onclick="forceTranslate()" style="padding:3px 8px;border-radius:5px;'
        +'border:1px solid #ff8080;background:transparent;color:#ff8080;cursor:pointer">'
        +'Trotzdem</button>';
      netWarn.classList.add('show');
    }
  } else {
    xlate=false; tbtn.textContent='→🇩🇪 Übersetzen'; tbtn.classList.remove('on');
    netWarn.classList.remove('show');
  }
}
function forceTranslate(){
  xlate=true; tbtn.textContent='✓ Übersetzen AN'; tbtn.classList.add('on');
  netWarn.classList.remove('show');
}
async function translate(text) {
  const from=lang, enc=encodeURIComponent(text);
  try {
    const r=await fetch('https://api.mymemory.translated.net/get?q='+enc+'&langpair='+from+'|de',{mode:'cors'});
    const d=await r.json();
    if(d.responseStatus===200){
      const t=(d.responseData?.translatedText||'').trim();
      if(t&&!t.startsWith('QUERY')&&t.toUpperCase()!==text.toUpperCase()) return t;
    }
  } catch(e){}
  try {
    const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl='+from+'&tl=de&dt=t&q='+enc);
    const d=await r.json();
    if(Array.isArray(d)&&d[0]){const t=d[0].map(c=>c[0]||'').join('').trim();if(t)return t;}
  } catch(e){}
  return null;
}

// ══════════════════════════════════════════════════
//  MIKROFON
// ══════════════════════════════════════════════════
function toggleMic() {
  if (listening) { stopMic(); } else { startMic(); }
}

function startMic() {
  if (!SR) {
    zeigFehler('⚠ Spracherkennung nicht verfügbar – bitte Chrome verwenden');
    return;
  }
  sessionSet.clear();
  listening = true;   // SOFORT – vor spawnRec(), verhindert Race Condition
  setUI(true);
  spawnRec();
}

function stopMic() {
  listening = false;  // SOFORT – blockiert jeden Neustart in onend
  clearTimeout(hideTimer);
  clearTimeout(restartTimer);
  killeRec();
  setUI(false);
  cur.innerHTML = '<span class="hint">EIN drücken → sprechen</span>';
}

function killeRec() {
  if (!rec) return;
  const r = rec; rec = null;
  r.onstart = null; r.onresult = null; r.onerror = null; r.onend = null;
  try { r.abort(); } catch(e) {}
}

// ══════════════════════════════════════════════════
//  Web Speech API
//  iOS/Desktop : continuous=true  (stabiler langer Stream)
//  Android     : continuous=false (Chrome Android liefert
//                mit continuous=true oft keinen Text)
//                → nach jedem Satz automatisch neu starten
// ══════════════════════════════════════════════════
function spawnRec() {
  if (!listening) return;
  killeRec();

  const r = new SR();
  rec = r;
  r.lang            = LANGS[lang].code;
  r.interimResults  = true;
  r.maxAlternatives = 1;
  r.continuous      = !isAndroid;  // false auf Android, true auf iOS/Desktop

  let lastFinalIdx = -1;

  r.onstart = () => {
    if (!listening) { killeRec(); return; }
    setPill('on', '● Hört zu …');
    startBars();
  };

  r.onresult = async (e) => {
    if (!listening) return;
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const seg = e.results[i];
      const t   = seg[0].transcript.trim();
      if (!t) continue;
      if (seg.isFinal) {
        if (i > lastFinalIdx) { lastFinalIdx = i; await verarbeiteText(t); }
      } else {
        interim = t;
      }
    }
    if (interim) {
      clearTimeout(hideTimer);
      cur.innerHTML = '<span class="interim">'+e2(interim)+'</span><span class="blink"></span>';
    }
  };

  r.onerror = (ev) => {
    if (!listening) return;
    if (ev.error === 'no-speech') return;  // normal bei Pausen
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
      zeigFehler('⚠ Mikrofon verweigert – Einstellungen → Apps → Chrome → Berechtigungen → Mikrofon');
      listening = false; setUI(false); return;
    }
    if (ev.error === 'network') {
      zeigFehler('⚠ Netzwerkfehler – WLAN/Mobilnetz prüfen');
      listening = false; setUI(false); return;
    }
  };

  r.onend = () => {
    if (!listening) return;  // Nutzer hat gestoppt → kein Neustart
    clearTimeout(restartTimer);
    restartTimer = setTimeout(spawnRec, isAndroid ? 150 : 100);
  };

  try {
    r.start();
  } catch(e) {
    clearTimeout(restartTimer);
    restartTimer = setTimeout(spawnRec, 400);
  }
}

// ══════════════════════════════════════════════════
//  Text verarbeiten (Duplikatschutz + Übersetzung)
// ══════════════════════════════════════════════════
async function verarbeiteText(text) {
  const clean = text.trim();
  if (!clean || clean.length<2) return;

  // Duplikat-Schutz
  const key = clean.toLowerCase().replace(/\s+/g,' ');
  if (sessionSet.has(key)) return;

  // Teilstring-Duplikat: neuer Text enthält alten oder umgekehrt
  for (const prev of sessionSet) {
    if (key.includes(prev) && prev.length > 4) {
      sessionSet.delete(prev); // ersetze alten durch neuen
      break;
    }
    if (prev.includes(key) && key.length > 4) return; // neuer ist Teilstring
  }

  sessionSet.add(key);

  if (xlate && lang!=='de') {
    cur.innerHTML=e2(clean)
      +'<span style="display:block;font-size:.5em;color:var(--yellow);margin-top:6px">⟳ ÜBERSETZE …</span>';
    setPill('tr','Übersetze …');
    const result = await translate(clean);
    if (result) {
      zeigText(result);
      addHist(clean, result);
    } else {
      zeigText(clean);
      addHist(clean, null);
    }
    setPill('on','● Hört zu …');
  } else {
    zeigText(clean);
    addHist(clean, null);
  }
}

// ── Text 7 Sekunden anzeigen dann blinken ──
function zeigText(text, blink=true) {
  clearTimeout(hideTimer);
  cur.innerHTML = e2(text) + (blink ? '<span class="blink"></span>' : '');
  hideTimer = setTimeout(()=>{
    if (listening) cur.innerHTML='<span class="blink"></span>';
  }, 7000);
}

function zeigFehler(msg) {
  cur.innerHTML='<span style="color:var(--red);font-size:.75em">'+e2(msg)+'</span>';
}

// ── UI ──
function setUI(on) {
  micbtn.classList.toggle('on', on);
  micLbl.textContent = on ? 'AUS' : 'EIN';
  barsEl.classList.toggle('on', on);
  if (!on) { stopBars(); setPill('','Bereit'); }
  // Vollbild-Mic-Button synchron halten
  const fmb = document.getElementById('fs-mic');
  if (fmb) fmb.classList.toggle('on', on);
}

function e2(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function addHist(orig, transl) {
  const d=document.createElement('div');
  d.className='hline';
  if (transl) {
    d.innerHTML=e2(transl)+'<span class="orig">'+(LANGS[lang]?.flag||'')+' '+e2(orig)+'</span>';
  } else {
    d.textContent=orig;
  }
  hist.appendChild(d);
  hist.scrollTo({top:hist.scrollHeight,behavior:'smooth'});
}

function clearAll() {
  hist.innerHTML='';
  sessionSet.clear();
  clearTimeout(hideTimer);
  cur.innerHTML=listening
    ?'<span class="blink"></span>'
    :'<span class="hint">EIN drücken → sprechen</span>';
}

function setPill(cls,txt){
  pill.className='pill'+(cls?' '+cls:'');
  pillTxt.textContent=txt;
}

function startBars(){
  let t=0;
  (function f(){
    t+=.1;
    bars.forEach((b,i)=>{
      b.style.height=(BAR_H[i]+Math.abs(Math.sin(t+i*.8))*(24-BAR_H[i])).toFixed(0)+'px';
    });
    barAnim=requestAnimationFrame(f);
  })();
}
function stopBars(){
  cancelAnimationFrame(barAnim);
  bars.forEach((b,i)=>b.style.height=BAR_H[i]+'px');
}

// ── Vollbild ──
let isFS = false;
const fsMicBtn = document.getElementById('fs-mic');

function toggleFullscreen() {
  isFS = !isFS;
  document.body.classList.toggle('fullscreen-mode', isFS);

  // Icons tauschen
  document.getElementById('fs-icon-enter').style.display = isFS ? 'none'  : 'block';
  document.getElementById('fs-icon-exit').style.display  = isFS ? 'block' : 'none';

  // Browser Fullscreen API (versteckt Adressleiste)
  if (isFS) {
    const el = document.documentElement;
    if (el.requestFullscreen)            el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else if (el.mozRequestFullScreen)    el.mozRequestFullScreen();
  } else {
    if (document.exitFullscreen)            document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    else if (document.mozCancelFullScreen)  document.mozCancelFullScreen();
  }
}

// Vollbild-MicBtn synchron halten
function syncFsMic() {
  if (!fsMicBtn) return;
  fsMicBtn.classList.toggle('on', listening);
}

// Fullscreen-Änderung von außen (z.B. Escape-Taste)
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && isFS) {
    isFS = false;
    document.body.classList.remove('fullscreen-mode');
    document.getElementById('fs-icon-enter').style.display = 'block';
    document.getElementById('fs-icon-exit').style.display  = 'none';
  }
});

async function wakeLock(){
  try{if('wakeLock' in navigator) await navigator.wakeLock.request('screen');}catch(e){}
}
wakeLock();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)wakeLock();});
</script>
